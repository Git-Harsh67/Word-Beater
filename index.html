<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Game</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-dark">
    <main>
      <!-- Home Page -->
      <section id="homePage" class="min-vh-100">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-8">
              <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body text-center p-5">
                  <h1 class="display-4 fw-bold mb-3">Word Beater</h1>

                  <p class="mb-4">
                    Do you have what it takes to become the fastest and most
                    accurate typist? Type every word correctly before the timer
                    runs out and become the ultimate
                    <strong>Word Beater</strong>!
                  </p>
                  <button
                    id="startBtn"
                    class="btn btn-primary btn-lg px-5 rounded-pill shadow"
                  >
                    Start
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Game Page -->

      <section id="mainPage" class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="bg-dark text-white">
              <div class="card-body text-center p-5">
                <h1 class="display-5 fw-bold text-light">Start Typing</h1>

                <p class="text-secondary fs-5">
                  Type the word before the timer runs out!
                </p>

                <!-- Current Word -->
                <h1
                  id="current-word"
                  class="display-4 fw-bold text-warning mb-4"
                >
                  Programming
                </h1>

                <!-- Timer & Score -->
                <div class="d-flex justify-content-evenly my-4">
                  <div class="p-2 ">
                    <h6>Time</h6>
                    <h2 id="time">10</h2>
                  </div>

                  <div class="p-2">
                    <h6>Score</h6>
                    <h2 id="score">0</h2>
                  </div>
                </div>

                <!-- Input -->
                <input
                  type="text"
                  id="word-input"
                  class="form-control form-control-lg text-center mb-3"
                  placeholder="Type the word here..."
                  autocomplete="off"
                />
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
